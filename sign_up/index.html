<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an Account</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="card">
    <div class="card-left">
      <h1>Create an Account</h1>

      <div class="social facebook">
        <span class="icon">f</span>
        <span class="label">Sign in with Facebook</span>
      </div>
      <div class="social twitter">
        <span class="icon">t</span>
        <span class="label">Sign in with Twitter</span>
      </div>
      <div class="social google">
        <span class="icon">G</span>
        <span class="label">Sign in with Google</span>
      </div>
      <div class="social behance">
        <span class="icon">Bē</span>
        <span class="label">Sign in with Behance</span>
      </div>
    </div>

    <div class="card-right">
      <h2>Modern Website Form</h2>

      <form>
        <div class="field">
          <input type="text" placeholder="username" aria-label="Username">
         
        </div>
        <div class="field">
          <input type="email" placeholder="email" aria-label="Email">
      
        </div>
        <div class="field">
          <input type="password" placeholder="password" aria-label="Password">

        <button type="button">SIGN UP</button>
      </form>
    </div>

  </div>

</body>
</html>
